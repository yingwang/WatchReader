name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # A throwaway key, made before any Gradle run: `test` covers the release variant too, and
      # release resource packaging refuses to run without a signing config. The real upload key
      # never leaves the developer's machine.
      - name: CI-only signing key
        run: |
          keytool -genkeypair -keystore watchreader-release.keystore -alias watchreader -keyalg RSA -keysize 2048 -validity 1 -storepass ci-only-pass -keypass ci-only-pass -dname "CN=ci" >/dev/null
          printf 'RELEASE_STORE_FILE=watchreader-release.keystore\nRELEASE_STORE_PASSWORD=ci-only-pass\nRELEASE_KEY_ALIAS=watchreader\nRELEASE_KEY_PASSWORD=ci-only-pass\n' > local.properties
      - run: ./gradlew test assembleDebug --no-daemon
      # Exercises R8, resource shrinking and the signing step.
      - name: Release build
        run: ./gradlew :wear:assembleRelease :mobile:assembleRelease --no-daemon
